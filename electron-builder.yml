appId: com.loopframe.app
productName: Loopframe
directories:
  output: release
files:
  - dist/**
  - package.json
asar: true
mac:
  category: public.app-category.utilities
  icon: build/icon.png
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: Loopframe displays exhibition websites that use the camera. You can turn this off in System Settings.
    NSMicrophoneUsageDescription: Loopframe can let listed exhibition websites use the microphone when that option is enabled in Loopframe settings.
win:
  icon: build/icon.png
  target:
    - nsis
linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Utility
